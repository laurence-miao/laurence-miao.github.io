{%- capture page_title -%}
  {%- if page.url == '/' -%}{{ site.title }}{%- else -%}{{ page.title }} | {{ site.title }}{%- endif -%}
{%- endcapture -%}
{%- assign page_description = page.description | default: site.description | strip_html | normalize_whitespace -%}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title | escape }}</title>
    <meta name="description" content="{{ page_description | escape }}">
    <meta name="author" content="{{ site.author | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page_title | escape }}">
    <meta property="og:description" content="{{ page_description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E{{ site.icon | url_encode }}%3C/text%3E%3C/svg%3E">

    <!-- Loaded without defer on purpose: it sets the color theme before first paint. -->
    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css" integrity="sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
