---
layout: default
---
<div class="post">
  <header class="post-header">
    <h1 class="post-title">
      {{- page.title -}}
      {%- if page.pdf %}
      <a class="float-right" href="{{ page.pdf | relative_url }}" target="_blank" rel="noopener" title="Download PDF" aria-label="Download PDF"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i></a>
      {%- endif -%}
    </h1>
    {%- if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {%- endif %}
  </header>

  <article>
    {{ content }}
  </article>
</div>
